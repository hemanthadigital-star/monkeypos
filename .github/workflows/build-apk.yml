name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare signing key
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/monkey.jks"; echo "KS_FILE=$RUNNER_TEMP/monkey.jks" >> "$GITHUB_ENV"; fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: node setup.js
        env:
          KS_PASS: ${{ secrets.KEY_PASSWORD }}
          KS_ALIAS: monkeypos
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
        env:
          KS_PASS: ${{ secrets.KEY_PASSWORD }}
          KS_ALIAS: monkeypos
      - uses: actions/upload-artifact@v4
        with:
          name: monkey-pos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
