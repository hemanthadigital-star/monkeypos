<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monkey Restaurant and Bar – POS</title>
<link rel="stylesheet" href="fonts.css"><style id="pst"></style>
<style>
:root{--bg:#12151a;--pn:#1b1f27;--pn2:#232834;--bd:#2c3340;--tx:#e8ebf0;--mu:#8b95a5;--ac:#34d1a0;--ac2:#08241b;--hi:#ffb547;--bad:#ff7b7b;--sb:#0c0e12;--lc:#fff;color-scheme:dark}
:root[data-theme="light"]{--bg:#eef0f3;--pn:#fff;--pn2:#f1f3f6;--bd:#d9dde4;--tx:#1a2230;--mu:#667085;--ac:#0f9d76;--ac2:#fff;--hi:#b86b00;--bad:#c62828;--sb:#fff;--lc:#000;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,sans-serif}
h3{margin:0 0 12px;font-size:17px;font-weight:600}
button{font:inherit;padding:10px 14px;border:1px solid var(--bd);background:var(--pn2);color:var(--tx);border-radius:10px;cursor:pointer}button:hover{border-color:var(--ac)}
button.on,button.pri{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
label{display:block;margin:8px 0;color:var(--mu);font-size:13px}label input,label select{margin-top:4px}label.ck{display:flex;gap:8px;align-items:center}label.ck input{width:auto;margin:0}
.mu,small{color:var(--mu)}.bad{color:var(--bad)!important}
#login{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.lg{width:340px;background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:26px}
.brand{font-weight:700;font-size:20px;line-height:1.15;color:var(--hi)}.brand span{display:block;font-weight:400;font-size:12px;color:var(--mu);margin-top:2px}
#app{display:none;grid-template-columns:210px 1fr;height:100vh}
header{display:flex;flex-direction:column;gap:6px;padding:16px 12px;background:var(--sb);border-right:1px solid var(--bd)}
#nav{display:flex;flex-direction:column;gap:4px;flex:1;margin-top:14px}#nav button{text-align:left;border-color:transparent;background:transparent;color:var(--mu)}#nav button.on{background:var(--pn2);color:var(--ac);border-left:3px solid var(--ac)}
#main{overflow:auto;padding:14px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.pos{display:grid;grid-template-columns:1fr 410px;gap:14px;align-items:start}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input{flex:1;min-width:130px}#cats{display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.it{display:flex;flex-direction:column;text-align:left;gap:4px;min-height:88px;justify-content:space-between;border-left:4px solid var(--mu)}.it span{color:var(--hi);font-weight:600}
.c0{border-left-color:#ffb547}.c1{border-left-color:#4da3ff}.c2{border-left-color:#b57cff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ln{display:grid;grid-template-columns:1fr auto 90px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.ln small{display:block}
.qty{display:flex;align-items:center;gap:8px}.qty button{padding:2px 11px}.amt{text-align:right}
.tt>div{display:flex;justify-content:space-between;align-items:center;padding:3px 0}.tt .g{font-size:24px;font-weight:700;color:var(--hi);border-top:1px solid var(--bd);margin-top:6px;padding-top:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.acts button{flex:1}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}.kp div{background:var(--pn2);border-radius:12px;padding:12px}.kp b{display:block;font-size:20px;color:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:150px}
#mod{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:14px;z-index:20}.mb{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--hi);color:#1a1200;padding:10px 18px;border-radius:22px;display:none;z-index:30;font-weight:600}
.hl{width:var(--lgs,150px);height:var(--lgs,150px);max-width:100%;margin:0 auto 8px;display:block}.lm{width:100%;height:100%;background:var(--lc);-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center}.lg .brand,header .brand{text-align:center}.al{color:var(--bad);border-color:var(--bad)}.occ{border-left-color:var(--bad)}.free{border-left-color:var(--ac)}.c3{border-left-color:#4dd6c1}.c4{border-left-color:#ff7a8a}.c5{border-left-color:#c8d84a}.lgr{width:70%;margin:0 auto 8px;padding:0;border:0;background:none;accent-color:var(--ac);display:none}.ft{text-align:center;color:var(--mu);font-size:11px;margin-top:6px}.ti{width:100%;height:68px;object-fit:cover;border-radius:8px}.seg3{display:flex;gap:6px;margin-bottom:12px}.rt{text-align:right!important}
@media(max-width:820px){
#app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px;border-right:0;border-bottom:1px solid var(--bd);gap:6px}
header .hl{width:44px;height:44px;margin:0}header .brand{font-size:13px;text-align:left;flex:1}
#nav{flex-direction:row;overflow-x:auto;order:5;width:100%;margin-top:0;flex:none}#nav button{white-space:nowrap;border-left:0!important}
header .ft{display:none}.pos{grid-template-columns:1fr}#main{padding:8px}
.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.kp{grid-template-columns:repeat(2,1fr)}.ln{grid-template-columns:1fr auto 70px}
#login{padding:12px}.lg{width:100%;max-width:340px}}
#print{display:none}
</style></head><body>
<div id="login"><div class="lg"><div id="ll" class="hl"></div><div class="brand"><b id="lbn"></b><span>Billing system</span></div><label>Username<input id="lu" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"></label><p id="le" class="bad"></p><button class="pri" style="width:100%" onclick="login()">Sign in</button><p class="ft" id="lft" style="margin-top:14px"></p></div></div>
<div id="app"><header><div id="hl" class="hl"></div><div class="brand" id="bn"></div><div id="nav"></div><button id="al" class="al" style="display:none" onclick="if(can('rep')){rm='alerts';go('rep')}else if(can('inv'))go('inv')"></button><small id="who"></small><button onclick="theme()">Dark / Light</button><button onclick="pwM()">Password</button><button onclick="logout()">Sign out</button><small class="ft" id="ft"></small></header><div id="main"></div></div>
<div id="mod" onclick="if(event.target==this)closeM()"></div><div id="toast"></div><div id="print"></div>

const pbox = (p) => PERMS.map(([k, l]) => '<label class="ck"><input type="checkbox" class="pk" value="'.concat(k, '" ').concat(p.includes(k) ? "checked" : "", "> ").concat(l, "</label>")).join("");
const getP = () => [...document.querySelectorAll(".pk:checked")].map((x) => x.value);
function vUsr() {
  $("#main").innerHTML = '<div class="card"><h3>Users</h3><div class="tbl"><table><tr><th>Name</th><th>Username</th><th>Role</th><th></th></tr>'.concat(db.users.map((u) => "<tr><td>".concat(esc(u.name), "</td><td>").concat(esc(u.user), "</td><td>").concat(u.role, '</td><td><button onclick="editU(').concat(u.id, ')">Edit</button> <button onclick="permM(').concat(u.id, ')">Privileges</button> <button onclick="resetM(').concat(u.id, ')">Reset password</button> ').concat(u.id == me.id ? "" : "<button onclick=\"askM('Delete user ".concat(esc(u.user), "?','delU(").concat(u.id, ")')\">Delete</button>"), "</td></tr>")).join(""), '</table></div></div>\n<div class="card"><h3>Add user</h3><div class="row"><label>Full name<input id="n1"></label><label>Username<input id="n2" autocomplete="off"></label><label>Password<input id="n3" type="password" autocomplete="new-password"></label><label>Role<select id="n4"><option value="cashier">Cashier</option><option value="admin">Admin (all privileges)</option></select></label></div><p class="mu">Privileges (for cashiers)</p>').concat(pbox(["sell", "close"]), '<div class="acts"><button class="pri" onclick="addU()">Add user</button></div></div>');
}
function addU() {
  const n = $("#n1").value.trim(), u = $("#n2").value.trim().toLowerCase(), p = $("#n3").value;
  if (!n || !u || p.length < 4) {
    toast("Fill all fields (password: 4+ characters)");
    return;
  }
  if (db.users.some((x) => x.user == u)) {
    toast("Username already exists");
    return;
  }
  db.users.push({ id: db.useq++, name: n, user: u, pass: H(p), role: $("#n4").value, perms: getP() });
  save();
  vUsr();
}
function permM(id) {
  const u = db.users.find((x) => x.id == id), ad = u.role == "admin";
  modal("<h3>Privileges: ".concat(esc(u.name), "</h3>").concat(ad ? '<p class="mu">Admins have every privilege.</p>' : pbox(u.perms || ["sell", "close"]), '<div class="acts"><button onclick="closeM()">Close</button>').concat(ad ? "" : '<button class="pri" onclick="savePerm('.concat(id, ')">Save</button>'), "</div>"));
}
function editU(id) {
  const u = db.users.find((x) => x.id == id);
  modal('<h3>Edit user</h3><label>Full name<input id="e1" value="'.concat(esc(u.name), '"></label><label>Username<input id="e2" value="').concat(esc(u.user), '"></label><label>Role<select id="e3"><option value="cashier" ').concat(u.role != "admin" ? "selected" : "", '>Cashier</option><option value="admin" ').concat(u.role == "admin" ? "selected" : "", '>Admin</option></select></label><div class="acts"><button onclick="closeM()">Cancel</button><button class="pri" onclick="saveU(').concat(id, ')">Save changes</button></div>'));
}
function saveU(id) {
  const u = db.users.find((x) => x.id == id), n = $("#e1").value.trim(), un = $("#e2").value.trim().toLowerCase(), r = $("#e3").value;
  if (!n || !un) {
    toast("Name and username are required");
    return;
  }
  if (db.users.some((x) => x.user == un && x.id != id)) {
    toast("Username already exists");
    return;
  }
  if (u.role == "admin" && r != "admin" && db.users.filter((x) => x.role == "admin").length < 2) {
    toast("Keep at least one admin");
    return;
  }
  Object.assign(u, { name: n, user: un, role: r });
  if (me.id == id) $("#who").textContent = u.name + " (" + u.role + ")";
  save();
  closeM();
  vUsr();
}
function savePerm(id) {
  db.users.find((x) => x.id == id).perms = getP();
  save();
  closeM();
  toast("Privileges saved");
}
function delU(id) {
  const u0 = db.users.find((x) => x.id == id);
  if (u0 && u0.role == "admin" && db.users.filter((x) => x.role == "admin").length < 2) {
    toast("Keep at least one admin");
    return;
  }
  db.users = db.users.filter((x) => x.id != id);
  save();
  vUsr();
}
function resetM(id) {
  modal('<h3>Reset password</h3><label>New password<input id="np" type="password"></label><div class="acts"><button onclick="closeM()">Cancel</button><button class="pri" onclick="setPw('.concat(id, ')">Save password</button></div>'));
}
function setPw(id) {
  const p = $("#np").value;
  if (p.length < 4) {
    toast("Use 4+ characters");
    return;
  }
  db.users.find((x) => x.id == id).pass = H(p);
  save();
  closeM();
  toast("Password updated");
}
function pwM() {
  modal('<h3>Change my password</h3><label>Current password<input id="op" type="password"></label><label>New password<input id="np" type="password"></label><div class="acts"><button onclick="closeM()">Cancel</button><button class="pri" onclick="if(me.pass!=H($(\'#op\').value)){toast(\'Current password is wrong\')}else setPw(me.id)">Save password</button></div>');
}
function vSet() {
  const s = db.set;
  $("#main").innerHTML = '<div class="card"><h3>Restaurant details</h3><div class="row"><label>Name<input id="bn1" value="'.concat(esc(B.name), '"></label><label>Address<input id="bn2" value="').concat(esc(B.addr), '"></label><label>Postal code<input id="bn3" value="').concat(esc(B.zip), '"></label><label>Contact no<input id="bn4" value="').concat(esc(B.phone), '"></label><label>Email<input id="bn5" value="').concat(esc(B.email), '"></label><label>Website<input id="bn6" value="').concat(esc(B.web), '"></label><label>Bill footer text<input id="bn7" value="').concat(esc(B.footer), '"></label></div><div class="row" style="align-items:center"><label>Logo (shown in the app and on bills)<input type="file" accept="image/*" onchange="pickLogo(this)"></label><span id="lgp" style="width:72px;height:72px;flex:0 0 72px;display:block">').concat(logoHtml(), '</span><button style="flex:0;white-space:nowrap" onclick="B.logo=\'\';$(\'#lgp\').innerHTML=logoHtml()">Use default logo</button></div></div><div class="card"><h3>Billing</h3><div class="row"><label>Service charge for dining (%)<input id="sv" type="number" min="0" value="').concat(s.svc, '"></label><label>Default invoice size<select id="ds">').concat(["A4", "80mm", "56mm"].map((x) => "<option ".concat(s.size == x ? "selected" : "", ">").concat(x, "</option>")).join(""), '</select></label></div></div>\n<div class="card"><h3>Logo and invoice layout</h3><div class="row"><label>Logo size in app: <b id="lpv">').concat(Math.min(180, s.logoPx), '</b> px<input id="lpx" type="range" min="60" max="180" value="').concat(Math.min(180, s.logoPx), '" style="padding:0;border:0;background:none;accent-color:var(--ac)" oninput="$(\'#lpv\').textContent=this.value;document.documentElement.style.setProperty(\'--lgs\',this.value+\'px\')"></label><label>Logo height on bill (mm)<input id="lmm" type="number" min="5" max="60" value="').concat(s.logoMm, '"></label><label>Receipt margin (mm)<input id="mg" type="number" min="0" max="20" value="').concat(s.mg, '"></label><label>A4 margin (mm)<input id="mga" type="number" min="0" max="40" value="').concat(s.mgA, '"></label></div></div>\n<div class="card"><h3>Tax</h3><label class="ck"><input id="tx1" type="checkbox" ').concat(s.taxEnabled ? "checked" : "", '> Enable tax option on orders</label><label class="ck"><input id="tx2" type="checkbox" ').concat(s.taxDefault ? "checked" : "", '> Add tax to new orders by default</label><div class="row"><label>Tax name<input id="tx3" value="').concat(esc(s.taxName), '"></label><label>Tax rate (%)<input id="tx4" type="number" min="0" step="0.01" value="').concat(s.taxRate, '"></label></div><p class="mu">Tax is calculated on the subtotal after discount plus service charge.</p></div>\n<div class="card"><h3>Fonts and sizes</h3><div class="row"><label>Invoice font<select id="if">').concat(["Arial", "Poppins", "Montserrat", "Consolas"].map((x) => "<option ".concat(s.font == x ? "selected" : "", ">").concat(x, "</option>")).join(""), '</select></label><label>Receipt font size (px)<input id="fs" type="number" min="8" max="24" value="').concat(s.fs, '"></label><label>A4 font size (px)<input id="fsa" type="number" min="8" max="24" value="').concat(s.fsA, '"></label><label>App font<select id="uf">').concat(["Segoe UI", "Poppins", "Arial", "Montserrat"].map((x) => "<option ".concat(s.uifont == x ? "selected" : "", ">").concat(x, "</option>")).join(""), '</select></label></div></div><div class="card"><h3>Bluetooth printer</h3><div class="row"><label>Paired printer<select id="pr"><option value="">Select printer</option></select></label><input id="sl" type="checkbox" hidden></div><p class="mu">Pair the printer in the phone Bluetooth settings first, then choose it here. 80mm / 56mm receipts print over Bluetooth. A4 and PDF use the Android print screen (choose Save as PDF).</p><div class="acts"><button onclick="prt(\'<div class=&quot;c big&quot;>TEST PRINT</div><hr><div class=&quot;c&quot;>Monkey POS</div>\',db.set.size==\'A4\'?\'80mm\':db.set.size)">Test print</button></div></div>\n<div class="card"><h3>Cash drawer</h3><div class="row"><label>Connection<select id="dm"><option value="none">None</option><option value="bt" ').concat(s.drawer == "bt" ? "selected" : "", '>Via Bluetooth printer</option></select></label><input id="cp" type="hidden" value=""><input id="sh" type="hidden" value=""></div><label class="ck"><input id="ad" type="checkbox" ').concat(s.autoDrawer ? "checked" : "", "> Open the drawer after cash payments</label><div class=\"acts\"><button onclick=\"api.drawer({drawer:$('#dm').value,com:$('#cp').value,share:$('#sh').value}).then(r=>toast(r.msg))\">Test drawer</button></div></div>\n<div class=\"card\"><h3>About</h3><p>Software version: v").concat(VER, "<br>Developer: ").concat(DEV, '</p></div><div class="card"><div class="acts"><button class="pri" onclick="setSave()">Save settings</button><button onclick="api.backup().then(r=>toast(r.msg))">Backup database</button><button onclick="$(\'#rf\').click()">Restore backup</button><input id="rf" type="file" hidden accept=".json,application/json" onchange="api.restore(this.files[0])"></div></div>');
  api.printers().then((p) => {
    $("#pr").innerHTML = '<option value="">Select printer</option>' + p.map((x) => '<option value="'.concat(x.address, '" ').concat(s.printer == x.address ? "selected" : "", ">").concat(esc(x.name), "</option>")).join("");
  }).catch((e) => toast(e.message || "Bluetooth error"));
}
function setSave() {
  db.set.biz = { name: $("#bn1").value.trim() || B.name, addr: $("#bn2").value.trim(), zip: $("#bn3").value.trim(), phone: $("#bn4").value.trim(), email: $("#bn5").value.trim(), web: $("#bn6").value.trim(), footer: $("#bn7").value.trim(), logo: B.logo || "" };
  B = { ...B, ...db.set.biz };
  applyB();
  Object.assign(db.set, { logoPx: +$("#lpx").value || 150, logoMm: +$("#lmm").value || 22, mg: Math.max(0, +$("#mg").value), mgA: Math.max(0, +$("#mga").value), taxEnabled: $("#tx1").checked, taxDefault: $("#tx2").checked, taxName: $("#tx3").value.trim() || "Tax", taxRate: +$("#tx4").value || 0, font: $("#if").value, fs: +$("#fs").value || 12, fsA: +$("#fsa").value || 13, uifont: $("#uf").value, svc: +$("#sv").value || 0, size: $("#ds").value, printer: $("#pr").value, silent: $("#sl").checked, drawer: $("#dm").value, com: $("#cp").value.trim(), share: $("#sh").value.trim(), autoDrawer: $("#ad").checked });
  save();
  applyF();
  applyB();
  toast("Settings saved");
}
api.load().then((d) => {
  db = d || D0();
  const kv = d && d.kv || {};
  db.tables = kv.tables || [];
  db.shifts = kv.shifts || [];
  db.emps = kv.emps || [];
  db.att = kv.att || {};
  db.sal = kv.sal || {};
  db.cats = kv.cats || ["Food", "Soft Drink", "Hard Drink"];
  db.items.forEach((i) => {
    if (!db.cats.includes(i.cat)) db.cats.push(i.cat);
  });
  db.set = { logoPx: 150, logoMm: 22, mg: 3, mgA: 14, taxName: "Tax", taxRate: 0, font: "Arial", fs: 12, fsA: 13, uifont: "Segoe UI", svc: 10, size: "80mm", printer: "", silent: false, drawer: "none", com: "COM1", share: "", autoDrawer: true, ...db.set };
  if (db.set.biz && db.set.biz.name == "Monkey Restaurant and Bar") db.set.biz.name = B.name;
  B = { ...B, ...db.set.biz || {} };
  applyB();
  applyF();
  document.documentElement.dataset.theme = db.set.theme || "dark";
  if (!d) save();
  $("#lu").focus();
}).catch((e) => alert("Database error: " + (e && e.message || e)));
document.addEventListener("keydown", (e) => {
  if (me && tab == "pos" && $("#mod").style.display != "flex" && document.activeElement === document.body && e.key.length == 1 && $("#sc")) $("#sc").focus();
});
